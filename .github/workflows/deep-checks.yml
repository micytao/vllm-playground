name: Deep checks (container builds)

# Slower, heavier checks that don't run on every PR: Podman + OpenShift
# container image builds, booted and smoke-tested against GET /api/status.
# The Podman build alone takes ~7-8 minutes (mostly
# `microdnf install podman-remote`), and container/OpenShift orchestration
# isn't the actively-developed primary use case (that's local/CLI usage),
# so it doesn't belong on every PR.
#
# Note: this deliberately does NOT install the real `vllm` package or spin
# up a subprocess-mode model server. `vllm` is only needed by users who
# choose subprocess mode on their own machine -- that's out of scope for
# this project's CI, which targets the container-based workflow (the
# images built/smoke-tested here already have vllm baked in upstream).
#
# Rather than a nightly cron (which would run even on days with zero new
# commits), this is wired as a required gate right before every real
# release -- see release.yml, which calls this as a reusable workflow via
# `uses:` -- so a broken release never ships. It's also available
# on-demand via workflow_dispatch for ad-hoc testing between releases.
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch/tag/SHA to run against (defaults to the calling workflow's commit)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to run against"
        required: false
        default: "development"
        type: string

permissions:
  contents: read

jobs:
  container-build-check:
    name: Container build check (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: vllm-playground (Podman orchestrator)
            containerfile: containers/Containerfile.vllm-playground
          - name: openshift (Kubernetes orchestrator)
            containerfile: openshift/Containerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.containerfile }}
          push: false
          load: true
          tags: vllm-playground-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot image and smoke test /api/status
        run: |
          docker run -d --name ci-smoke -p 7860:7860 vllm-playground-ci:test
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7860/api/status > /dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs ci-smoke || true
          docker rm -f ci-smoke || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::Container never became healthy on /api/status"
            exit 1
          fi
