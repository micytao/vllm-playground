name: CI

# Covers both tiers of the branching strategy with a single workflow file:
#   - feat/* -> development PRs/pushes
#   - development -> main PRs/pushes
# See the CI/CD Pipeline Design plan for the full rationale.
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint & structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tooling
        run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: Verify single-source-of-truth project structure
        run: python scripts/verify_structure.py

  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -v --cov=vllm_playground --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml

  api-tests:
    name: API tests (FastAPI TestClient)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev + optional extras
        run: pip install -e ".[dev,mcp,benchmark]"
      - name: Run API tests
        run: pytest tests/api -v

  container-manager-tests:
    name: Container manager tests (real podman)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman info
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run container manager tests
        run: pytest tests/container -v

  k8s-manager-tests:
    name: Kubernetes manager tests (kind)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: vllm-playground-ci
      - name: Install package with dev extras (includes kubernetes client)
        run: pip install -e ".[dev]"
      - name: Run Kubernetes manager tests
        run: pytest tests/k8s -v

  frontend-smoke:
    name: Frontend smoke tests (Playwright)
    needs: lint
    runs-on: ubuntu-latest
    # tests/conftest.py intentionally redirects $HOME to an isolated temp
    # dir for the whole test session (so tests never touch a real
    # ~/.vllm-playground). Playwright's Python client resolves its browser
    # cache as $HOME/.cache/ms-playwright *at runtime*, so it would
    # otherwise look in the swapped-out HOME instead of where `playwright
    # install` actually put the browser. Pin it to a fixed path so both
    # steps agree regardless of what $HOME is at the time.
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Run frontend smoke tests
        run: pytest tests/frontend -v

  package-build:
    name: Package build (sdist/wheel)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata (twine check)
        run: twine check dist/*
      - name: Install built wheel into a clean venv and smoke test the CLI
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/vllm-playground --version
          # "status" exits 1 when nothing is running -- that IS the expected
          # state for a fresh install, so don't fail the build on that.
          /tmp/wheel-venv/bin/vllm-playground status || true

  # NOTE: container image build/smoke-test checks (Podman + OpenShift
  # Containerfiles) intentionally do NOT run anywhere in this pipeline
  # (not here, and not as a release gate either). They're slow (the
  # Podman one takes ~9+ minutes, mostly `microdnf install
  # podman-remote`) and container/OpenShift orchestration is not this
  # project's actively-developed, primary use case (that's local/CLI
  # usage). If the Containerfiles ever need re-validating, build them
  # manually with `docker build -f containers/Containerfile.vllm-playground .`
  # (or the openshift/Containerfile equivalent) before a release.

  manifest-validate:
    name: Validate Kubernetes/OpenShift manifests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: |
          kubeconform -strict -ignore-missing-schemas -summary \
            deployments/*.yaml openshift/manifests/*.yaml

  dependency-audit:
    name: Dependency vulnerability audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  # Single required status check to point branch protection at instead of
  # every individual (and matrixed) job name above.
  ci-summary:
    name: CI summary
    if: always()
    needs:
      - lint
      - unit-tests
      - api-tests
      - container-manager-tests
      - k8s-manager-tests
      - frontend-smoke
      - package-build
      - manifest-validate
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
